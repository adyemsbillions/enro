<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enro Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --p:#5B3DF5;--p2:#8A6CFF;--pl:#EEEBFF;
  --gold:#E89B00;--goldl:#FFF4D6;
  --cash:#0E9F62;--cashl:#DCF6E9;
  --red:#E5484D;--redl:#FDE8E8;
  --amber:#B76E00;--amberl:#FFF0D1;
  --bg:#F5F4FA;--card:#fff;--ink:#16141F;--mut:#6D6A80;--line:#E8E6F0;
  --stage:#E6E3F0;--dark:#16141F;--dark2:#26233A;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--stage);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
svg{flex-shrink:0}

/* top switcher */
.top{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--dark);color:#fff;position:sticky;top:0;z-index:50;flex-wrap:wrap}
.top .brand{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.top .brand small{font-weight:500;color:#9C98B5;font-size:12px}
.seg{display:flex;background:var(--dark2);border-radius:10px;padding:3px;margin-left:auto}
.seg button{padding:7px 14px;border-radius:8px;font-weight:600;font-size:13px;color:#B9B5D0}
.seg button.on{background:#fff;color:var(--ink)}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}

/* mobile stage */
.stage{display:flex;gap:28px;justify-content:center;padding:28px 16px;align-items:flex-start}
.jump{width:210px;background:#fff;border-radius:16px;padding:12px;position:sticky;top:76px}
.jump .jt{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:4px 10px 8px}
.jump button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:8px;font-size:13px;font-weight:500}
.jump button:hover{background:var(--bg)}
.jump button.on{background:var(--pl);color:var(--p);font-weight:700}
.jump hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.notes{width:240px;background:#fff;border-radius:16px;padding:16px;position:sticky;top:76px;font-size:13px;color:var(--mut);line-height:1.55}
.notes h4{color:var(--ink);font-size:13px;margin-bottom:6px}
.notes p+h4{margin-top:14px}
.phone{width:390px;height:812px;background:#0B0A10;border-radius:50px;padding:11px;box-shadow:0 30px 60px -20px rgba(40,20,120,.35);flex-shrink:0}
.scr{width:100%;height:100%;background:var(--bg);border-radius:40px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.scr.dark{background:linear-gradient(160deg,#6A4BFF,#3B1FC7);color:#fff}
.status{height:46px;display:flex;justify-content:space-between;align-items:center;padding:4px 28px 0;font-size:14px;font-weight:700;flex-shrink:0}
.status .r{display:flex;gap:6px;align-items:center}
.body{flex:1;overflow-y:auto;position:relative;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.pad{padding:8px 20px 24px}
.nav{height:78px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding-top:10px;flex-shrink:0}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#9A97AC;width:64px}
.nav button.on{color:var(--p)}

/* ui atoms */
.h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.h2{font-size:20px;font-weight:800;letter-spacing:-.01em}
.h3{font-size:15px;font-weight:700}
.sub{color:var(--mut);font-size:14px;line-height:1.5}
.sm{font-size:12px;color:var(--mut)}
.card{background:var(--card);border-radius:18px;padding:16px;border:1px solid var(--line)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:14px;background:var(--p);color:#fff;font-weight:700;font-size:15px;transition:.15s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.cash{background:var(--cash)}
.btn.dis{background:#C9C5DA;pointer-events:none}
.btn.sm{height:38px;font-size:13px;border-radius:10px;width:auto;padding:0 14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.inp{display:flex;align-items:center;gap:10px;height:52px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;color:var(--mut)}
.inp:focus-within{border-color:var(--p)}
.inp input,.inp select{flex:1;border:0;outline:0;background:none;font-size:15px;color:var(--ink);min-width:0}
textarea.ta{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:80px;outline:0;resize:none;font-size:14px}
textarea.ta:focus{border-color:var(--p)}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{padding:8px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.coin{background:var(--goldl);color:var(--amber)}
.pill.cash{background:var(--cashl);color:var(--cash)}
.pill.pend{background:var(--amberl);color:var(--amber)}
.pill.ok{background:var(--cashl);color:var(--cash)}
.pill.bad{background:var(--redl);color:var(--red)}
.pill.pur{background:var(--pl);color:var(--p)}
.pill.grey{background:#EEEDF3;color:var(--mut)}
.ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex-shrink:0}
.ico.p{background:var(--pl);color:var(--p)}
.ico.g{background:var(--goldl);color:var(--gold)}
.ico.c{background:var(--cashl);color:var(--cash)}
.ico.r{background:var(--redl);color:var(--red)}
.list .it{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .it .t{flex:1;min-width:0}
.list .it .t b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.taskc{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;width:100%;text-align:left}
.taskc .t{flex:1;min-width:0}
.taskc .t b{display:block;font-size:14px;font-weight:700;line-height:1.3}
.taskc.done{opacity:.55}
.bar{height:6px;border-radius:9px;background:#ECEAF3;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cash);border-radius:9px}
.back{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
.hdr{display:flex;align-items:center;gap:12px;padding:6px 20px 12px}
.hdr .h2{flex:1}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#FFB86B,#FF6B8B);color:#fff;font-weight:800;display:grid;place-items:center;font-size:15px;flex-shrink:0}
.dot{position:relative}
.dot::after{content:'';position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid #fff}

/* ad slots */
.ad{border:1.5px dashed #C8C2E6;border-radius:12px;background:repeating-linear-gradient(45deg,#FAF9FE,#FAF9FE 8px,#F3F1FB 8px,#F3F1FB 16px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8C86AE;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;gap:2px;text-align:center}
.ad span{font-weight:500;text-transform:none;letter-spacing:0;font-size:11px}

/* balance hero */
.hero{border-radius:22px;padding:18px;background:linear-gradient(140deg,#6A4BFF 0%,#4527D9 100%);color:#fff;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08);right:-60px;top:-80px}
.hero .bal{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative}
.hero .bx{background:rgba(255,255,255,.13);border-radius:14px;padding:12px}
.hero .bx small{font-size:11.5px;opacity:.8;font-weight:600;display:flex;align-items:center;gap:5px}
.hero .bx b{display:block;font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.01em}
.hero .bx em{font-style:normal;font-size:11px;opacity:.75}
.hero .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;position:relative}
.hero .acts button{height:40px;border-radius:11px;background:#fff;color:var(--p);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.cat{border-radius:18px;padding:16px;color:#fff;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px;position:relative;overflow:hidden}
.cat b{font-size:16px;font-weight:800}
.cat small{font-size:12px;opacity:.85;line-height:1.4}
.cat .tag{align-self:flex-start;background:rgba(255,255,255,.22);padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700;margin-top:auto}
.streak{display:flex;justify-content:space-between}
.streak div{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--mut)}
.streak i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;background:#F0EEF6;color:#A7A3BB}
.streak .y i{background:var(--goldl);color:var(--gold)}
.streak .n i{background:var(--p);color:#fff;box-shadow:0 0 0 3px var(--pl)}

/* onboarding */
.ob{display:flex;flex-direction:column;height:100%;padding:0 24px 28px}
.illus{flex:1;display:grid;place-items:center;position:relative}
.illus .big{width:200px;height:200px;border-radius:56px;display:grid;place-items:center;color:#fff;transform:rotate(-6deg);box-shadow:0 30px 50px -20px rgba(91,61,245,.55)}
.illus .big svg{transform:rotate(6deg)}
.float{position:absolute;background:#fff;border-radius:14px;padding:9px 12px;font-size:13px;font-weight:800;box-shadow:0 12px 30px -10px rgba(30,20,80,.25);display:flex;align-items:center;gap:6px}
.dots{display:flex;gap:6px;justify-content:center;margin:20px 0}
.dots i{width:8px;height:8px;border-radius:9px;background:#D6D2E6;transition:.2s}
.dots i.on{width:24px;background:var(--p)}

/* otp */
.otp{display:flex;gap:10px;justify-content:center}
.otp input{width:46px;height:56px;border-radius:14px;border:1.5px solid var(--line);text-align:center;font-size:22px;font-weight:800;outline:0;background:#fff}
.otp input:focus{border-color:var(--p)}

/* wallet */
.tabs{display:flex;background:#ECEAF3;border-radius:13px;padding:4px}
.tabs button{flex:1;height:38px;border-radius:10px;font-size:13px;font-weight:700;color:var(--mut)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.06)}
.nets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.net{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700}
.net i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800}
.net.on{border-color:var(--p);background:var(--pl)}
.amts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amt{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left}
.amt b{display:block;font-size:17px;font-weight:800}
.amt.on{border-color:var(--p);background:var(--pl)}
.amt.no{opacity:.45}

.upload{border:1.5px dashed #BDB6E3;border-radius:16px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--p);background:#FBFAFF;width:100%}
.upload.done{border-style:solid;border-color:var(--cash);color:var(--cash);background:var(--cashl)}
.steps{counter-reset:s}
.steps li{list-style:none;display:flex;gap:12px;padding:8px 0;font-size:14px;line-height:1.45}
.steps li::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--pl);color:var(--p);font-weight:800;font-size:12px;display:grid;place-items:center;flex-shrink:0}

/* overlays */
.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;z-index:30;display:flex;gap:8px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.ovl{position:absolute;inset:0;background:rgba(10,8,20,.92);z-index:20;display:flex;flex-direction:column;padding:56px 20px 30px;color:#fff}
.ovl .ad{flex:1;border-color:#4A4566;background:repeating-linear-gradient(45deg,#1D1A2B,#1D1A2B 10px,#232035 10px,#232035 20px);color:#8F8AB0;font-size:13px}
.ovl .x{align-self:flex-end;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center;margin-bottom:12px;font-size:13px;font-weight:800}
.sheet{position:absolute;inset:0;background:rgba(10,8,20,.45);z-index:20;display:flex;align-items:flex-end}
.sheet .in{background:#fff;width:100%;border-radius:26px 26px 0 0;padding:24px 20px 30px;text-align:center}

/* admin */
.adm{display:flex;min-height:calc(100vh - 52px)}
.side{width:236px;background:var(--dark);color:#B7B3CC;padding:18px 12px;flex-shrink:0;display:flex;flex-direction:column;gap:2px}
.side .lg{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;padding:4px 10px 18px}
.side button{display:flex;gap:11px;align-items:center;width:100%;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;text-align:left}
.side button:hover{background:#1F1C2E}
.side button.on{background:var(--dark2);color:#fff}
.side button .n{margin-left:auto;background:var(--red);color:#fff;font-size:11px;border-radius:99px;padding:1px 7px}
.main{flex:1;padding:24px 28px;min-width:0}
.atop{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.atop .h1{flex:1;font-size:24px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.kpi small{font-size:12.5px;color:var(--mut);font-weight:600}
.kpi b{display:block;font-size:24px;font-weight:800;margin:6px 0 4px;letter-spacing:-.02em}
.kpi em{font-style:normal;font-size:12px;font-weight:700;color:var(--cash)}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-top:16px}
.tblw{background:#fff;border:1px solid var(--line);border-radius:16px;overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px}
.tbl th{text-align:left;color:var(--mut);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:12px 14px;border-bottom:1px solid var(--line);background:#FBFAFD}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .u{display:flex;align-items:center;gap:10px}
.tbl .u .av{width:32px;height:32px;font-size:12px}
.acts{display:flex;gap:6px}
.ab{height:32px;padding:0 12px;border-radius:9px;font-size:12.5px;font-weight:700;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;gap:5px}
.ab.ok{background:var(--cash);border-color:var(--cash);color:#fff}
.ab.no{color:var(--red)}
.ab.pri{background:var(--p);border-color:var(--p);color:#fff}
.thumb{width:44px;height:44px;border-radius:9px;background:linear-gradient(135deg,#DCD6FF,#F2EFFF);display:grid;place-items:center;color:var(--p)}
.sw{width:40px;height:23px;border-radius:99px;background:#D3D0DE;position:relative;transition:.2s;flex-shrink:0}
.sw::after{content:'';position:absolute;width:17px;height:17px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--cash)}
.sw.on::after{left:20px}
.atabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.atabs button{padding:10px 14px;font-weight:700;font-size:14px;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.atabs button.on{color:var(--p);border-color:var(--p)}
.modal{position:fixed;inset:0;background:rgba(10,8,20,.5);z-index:100;display:grid;place-items:center;padding:16px}
.modal .in{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.adinp{height:42px;border:1.5px solid var(--line);border-radius:11px;padding:0 12px;width:100%;outline:0;font-size:14px;background:#fff}
.adinp:focus{border-color:var(--p)}
.set{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .t{flex:1}
.set .t b{display:block;font-size:14px}
.atoast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:200;pointer-events:none}
.atoast.show{opacity:1;transform:translate(-50%,0)}
.alogin{min-height:calc(100vh - 52px);display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 20%,#E9E4FF,transparent 50%),var(--bg)}

@media(max-width:1100px){.notes{display:none}}
@media(max-width:760px){
  .jump{display:none}
  .stage{padding:0}
  .phone{width:100%;max-width:440px;height:calc(100vh - 52px);border-radius:0;padding:0;box-shadow:none}
  .scr{border-radius:0}
  .side{width:64px;padding:14px 8px}.side span,.side .n,.side .lg b{display:none}
  .main{padding:18px 16px}
  .grid2,.f2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><div class="logo">E</div>Enro <small>Prototype · Do tasks & earn</small></div>
  <div class="seg">
    <button data-v="mobile" onclick="setView('mobile')">Mobile app</button>
    <button data-v="admin" onclick="setView('admin')">Admin panel</button>
  </div>
</div>
<div id="app"></div>
<div id="atoast" class="atoast"></div>

<script>
/* ---------- icons ---------- */
const I={
home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>',
wallet:'<path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2z"/><circle cx="16" cy="14.5" r="1.2"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>',
bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/>',
play:'<circle cx="12" cy="12" r="9"/><path d="m10 8.5 5 3.5-5 3.5z"/>',

function startTask(id){
 const t=TASKS.find(x=>x.id===id);let left=t.sec;const box=document.getElementById('tbtn');
 const paint=()=>{box.innerHTML=`<button class="btn dis" style="background:var(--pl);color:var(--p)">${ic('clock',18)} Keep the app open… ${left}s</button><div class="bar mt8"><i style="width:${(1-left/t.sec)*100}%;background:var(--p)"></i></div>`};
 paint();toast(`${ic('link',16)} Task opened`);
 timer=setInterval(()=>{left--;if(left<=0){clearInterval(timer);box.innerHTML=`<button class="btn" style="background:var(--gold)" onclick="claim(${id})">${ic('coin',18)} Claim ${t.reward} coins</button>`}else paint()},1000);
}
function claim(id){const t=TASKS.find(x=>x.id===id);
 showInterstitial(()=>{S.done[id]=1;S.coins+=t.reward;S.hist.unshift({t:t.title,k:'coin',v:t.reward,s:'ok',d:'Just now'});render();toast(`${ic('coin',16)} +${t.reward} coins added`)})}
function showInterstitial(cb){
 const o=document.getElementById('ovl');let n=3;
 const paint=()=>{o.innerHTML=`<div class="ovl"><div class="x" ${n>0?'':'onclick="closeAd()"'} style="${n>0?'':'cursor:pointer'}">${n>0?n:ic('x',18)}</div><div class="ad">${ic('ad',36,1.6)}Adsterra interstitial<span>Full-screen ad after task claim</span></div><div class="sm" style="color:#8F8AB0;text-align:center;margin-top:12px">Ad · closes in ${n>0?n+'s':'— tap ✕'}</div></div>`};
 window._adcb=cb;paint();const h=setInterval(()=>{n--;paint();if(n<=0)clearInterval(h)},1000)}
function closeAd(){document.getElementById('ovl').innerHTML='';window._adcb&&window._adcb()}
function redeem(){
 const isAir=S.wsub==='airtime';const o=isAir?{l:N(S.amt),c:S.amt*10}:(()=>{const d=DATA.find(x=>x[0]===S.amt);return{l:d[0],c:d[2]}})();
 S.coins-=o.c;S.hist.unshift({t:`${S.net} ${isAir?'Airtime':'Data'} ${o.l}`,k:'redeem',v:-o.c,s:'ok',d:'Just now'});S.amt=null;render();
 document.getElementById('ovl').innerHTML=`<div class="sheet" onclick="this.remove()"><div class="in"><div class="ico c" style="width:64px;height:64px;border-radius:50%;margin:0 auto">${ic('check',32,2.6)}</div><div class="h2 mt16">${isAir?'Airtime':'Data'} on its way!</div><p class="sub mt8">${o.l} ${S.net} ${isAir?'airtime':'data'} is being sent to ${S.phone}. ${fmt(o.c)} coins deducted.</p><button class="btn mt20">Done</button></div></div>`}
function withdraw(){const a=Number(S.wamt);S.cash-=a+50;S.hist.unshift({t:`Cash withdrawal → ${S.bank}`,k:'wd',v:-a,s:'pend',d:'Just now'});S.wamt='';render();
 document.getElementById('ovl').innerHTML=`<div class="sheet" onclick="this.remove()"><div class="in"><div class="ico c" style="width:64px;height:64px;border-radius:50%;margin:0 auto">${ic('clock',30)}</div><div class="h2 mt16">Withdrawal requested</div><p class="sub mt8">${N(a)} to ${S.bank} •••• ${S.acct.slice(-4)}. You'll be notified once it's paid (usually within 24h).</p><button class="btn mt20">Done</button></div></div>`}

 const sp=S.atab==='special',title=document.getElementById('nt_title').value||'Untitled task',r=Number(document.getElementById('nt_reward').value)||0,type=document.getElementById('nt_type').value;

 else AD.tasks.unshift({id:Date.now(),title,reward:r,type,icon:{Watch:'play',Visit:'link',Social:'users',Daily:'calendar'}[type],on:true,comp:0});
 S.modal=false;render();atoast('Task published')}
